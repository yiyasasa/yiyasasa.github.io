name: GitFit Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 */3 * *'

permissions:
  contents: read

env:
  GIT_FIT_DATABASE_PATH: ${{ vars.GIT_FIT_DATABASE_PATH || 'data/db/git-fit.db' }}

jobs:
  sync:

    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}

    env:
      GIT_FIT_SYNC_TIME_BUDGET: ${{ vars.GIT_FIT_SYNC_TIME_BUDGET || '300' }}

    steps:
    - name: '[db] Derive database paths'
      id: db-paths
      uses: git-fit-actions/db-store/paths@v1
      with:
        database-path: ${{ env.GIT_FIT_DATABASE_PATH }}
    - name: '[db] Restore database'
      id: db-restore
      uses: git-fit-actions/db-store/cache/restore@v1
      with:
        db-dir: ${{ steps.db-paths.outputs.dir }}
        db-name: ${{ steps.db-paths.outputs.name }}
    - name: '[keep] Restore from cache'
      uses: git-fit-actions/data-store/cache/restore@v1
      with:
        source: keep
    - name: '[igpsport] Restore from cache'
      uses: git-fit-actions/data-store/cache/restore@v1
      with:
        source: igpsport
    - name: '[xingzhe] Restore from cache'
      uses: git-fit-actions/data-store/cache/restore@v1
      with:
        source: xingzhe
    - name: '[ruby] Set up Ruby'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ vars.RUBY_VERSION || '3.4' }}
        bundler-cache: true
    - run: bundle init && bundle add git-fit --quiet
    - name: '[git-fit] Run sync'
      run: bundle exec git fit sync --checkpoint
      env:
        GIT_FIT_KEEP_PHONE: ${{ secrets.GIT_FIT_KEEP_PHONE }}
        GIT_FIT_KEEP_PASSWORD: ${{ secrets.GIT_FIT_KEEP_PASSWORD }}
        GIT_FIT_IGPSPORT_PHONE: ${{ secrets.GIT_FIT_IGPSPORT_PHONE }}
        GIT_FIT_IGPSPORT_PASSWORD: ${{ secrets.GIT_FIT_IGPSPORT_PASSWORD }}
        GIT_FIT_XINGZHE_EMAIL: ${{ secrets.GIT_FIT_XINGZHE_EMAIL }}
        GIT_FIT_XINGZHE_PASSWORD: ${{ secrets.GIT_FIT_XINGZHE_PASSWORD }}
    - name: '[db] Save database'
      id: db-save
      uses: git-fit-actions/db-store/cache/save@v1
      with:
        db-dir: ${{ steps.db-paths.outputs.dir }}
        db-name: ${{ steps.db-paths.outputs.name }}
    - name: '[db] Upload artifact'
      if: steps.db-save.outputs.changed == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: git-fit-db
        path: data/db
        retention-days: 1
        if-no-files-found: error
    - name: '[keep] Sync keep data'
      id: keep-save
      uses: git-fit-actions/data-store/cache/save@v1
      with:
        source: keep
    - name: '[igpsport] Sync igpsport data'
      id: igpsport-save
      uses: git-fit-actions/data-store/cache/save@v1
      with:
        source: igpsport
    - name: '[xingzhe] Sync xingzhe data'
      id: xingzhe-save
      uses: git-fit-actions/data-store/cache/save@v1
      with:
        source: xingzhe
    - name: '[summary] Cache save status'
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
        ## Data source cache save status

        | Source | Changed |
        | --- | --- |
        | keep | ${{ steps.keep-save.outputs.changed }} |
        | igpsport | ${{ steps.igpsport-save.outputs.changed }} |
        | xingzhe | ${{ steps.xingzhe-save.outputs.changed }} |
        EOF
